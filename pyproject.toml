[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkgai-agent-loop"
version = "0.1.0"
description = "A small, safety-conscious asynchronous LLM agent loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.21,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
hkgai-agent = "hkgai_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
